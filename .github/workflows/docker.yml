name: Docker CI

on:
  push:
    tags:
      - 'v*'

jobs:
  docker:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get version
        id: version
        shell: cmd
        run: echo version=%GITHUB_REF_NAME%>>%GITHUB_OUTPUT%

      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/my-web:${{ steps.version.outputs.version }} ./docker

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/my-web:${{ steps.version.outputs.version }}